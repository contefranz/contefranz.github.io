project:
  type: website
  output-dir: _site

execute:
  freeze: auto

website:
  title: "Dr. Francesco Grossetti"
  description: "Francesco Grossetti — Assistant Professor of Accounting Analytics and Data Science at Bocconi University. Research on corporate disclosure, tax outcomes, and investor reactions using NLP, machine learning, and computational statistics."
  site-url: https://contefranz.github.io
  repo-url: https://github.com/contefranz/contefranz.github.io
  image: https://contefranz.github.io/profile.jpeg
  open-graph: true
  twitter-card: true
  navbar:
    pinned: true
    background: light
    left:
      - href: index.qmd
        text: About
      - href: publications.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: code.qmd
        text: Code
    right:
      - icon: github
        href: https://github.com/contefranz
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/francesco-grossetti/
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:francesco.grossetti@unibocconi.it
        aria-label: Email
  page-footer:
    background: light
    left: "© 2026 Francesco Grossetti"
    right:
      - icon: github
        href: https://github.com/contefranz
      - icon: envelope
        href: mailto:francesco.grossetti@unibocconi.it

filters:
  - citation-meta

format:
  html:
    theme:
      light: cosmo
    css: styles.css
    toc: true
    toc-location: right
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: true
    fontsize: 1.05em
    mainfont: "Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
    monofont: "JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace"
